dateCreated: '2026-09-28T19:25:06.714717+00:00'
description: "This dataset connects the activity of neurons in mouse primary visual
  cortex (VISp) to their molecular cell type.\n\nWe recorded the activity of neurons
  in awake, head-fixed mice with a multiplane two-photon mesoscope. We recorded 8
  imaging planes at about 10.7 Hz per plane. Each mouse had 4 imaging sessions:\n\n
  1 natural-movie session: 55 movie clips and one repeated test clip.\n3 drifting-grating
  sessions: 2 s gratings in a contrast series and a temporal-frequency series.\nAll
  sessions also include spontaneous (gray-screen) periods.\nDuring each session we
  also recorded:\n\nwheel running speed,\npupil, eye and corneal-reflection position
  and size (Lightning Pose keypoints with ellipse fits),\nface, nose and body motion
  (Facemap motion energy and motion SVD).\nAfter the imaging, we measured gene expression
  in serial tissue sections with 10x Xenium ([~300]-gene panel). We registered the
  Xenium cells to an in vivo cortical z-stack and to the imaged neurons. We mapped
  the Xenium cells to the Allen Brain Cell Atlas taxonomy (class, subclass, supertype
  and cluster).\n\nEach NWB file contains one imaging session:\n\nAll ophys data:
  ROI masks, fluorescence, dF/F and detected events.\nThe stimulus: interval tables,
  and the movie frames in the movie session.\nThe behavior data.\nFor the ROIs that
  are coregistered in that session only: a cell-type table and a cell-by-gene count
  table.\nA cross-session cell ID lets you find the same neuron in the other sessions
  of the mouse. Stimulus times are corrected with the monitor delay that we measured
  with a photodiode."
